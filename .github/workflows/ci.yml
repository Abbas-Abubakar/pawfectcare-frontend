name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only allow the workflow to read repository contents
permissions:
  contents: read

# If you push again while a run is in progress, cancel the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.20.0
          cache: npm

      - run: npm ci

      - run: npm run build